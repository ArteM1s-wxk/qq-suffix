[project]
name = "qq-suffix"
version = "0.1.0"
description = "QQ 频道自动追加后缀工具"
requires-python = ">=3.11"
dependencies = [
    "keyboard>=0.13.5",
    "pywin32>=306",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_suffix"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
